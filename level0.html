<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dungeon Runner - Level 0</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(10, 9, 8, 0.88);
      --line: rgba(244, 219, 157, 0.22);
      --text: rgba(248, 232, 194, 0.86);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #020202;
      font-family: Arial, Helvetica, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
      image-rendering: pixelated;
      background: #050403;
    }

    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .hint {
      position: absolute;
      bottom: 22px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      opacity: 0.82;
      backdrop-filter: blur(3px);
    }

    .top-hud {
      position: absolute;
      top: 16px;
      left: 50%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      opacity: 0.86;
      transform: translateX(-50%);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
    }

    .level-jump {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .level-jump input {
      width: 58px;
      height: 28px;
      border: 2px solid rgba(248, 232, 194, 0.62);
      background: #15130f;
      color: var(--text);
      font: inherit;
      text-align: center;
    }

    .level-jump button {
      height: 28px;
      border: 2px solid rgba(248, 232, 194, 0.62);
      background: #29241c;
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    .inventory {
      display: flex;
      gap: 10px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .status-line {
      min-width: 120px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      color: rgba(248, 232, 194, 0.72);
    }

    .item-menu {
      position: absolute;
      top: 70px;
      left: 50%;
      display: flex;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      background: rgba(10, 9, 8, 0.92);
      color: var(--text);
      opacity: 0.9;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .item-menu.hidden {
      display: none;
    }

    .item-menu span {
      padding: 6px 8px;
      border: 2px solid rgba(248, 232, 194, 0.48);
      background: #181511;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .hint-left {
      left: 22px;
    }

    .hint-right {
      right: 22px;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(3, 34px);
      grid-template-rows: repeat(2, 34px) 20px;
      gap: 5px;
    }

    .key,
    .mouse-button {
      display: grid;
      place-items: center;
      min-width: 34px;
      height: 34px;
      border: 2px solid rgba(248, 232, 194, 0.72);
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0)),
        #22201d;
      color: rgba(255, 246, 220, 0.92);
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
      text-shadow: 2px 2px 0 #050403;
      box-shadow:
        inset -3px -3px 0 rgba(0, 0, 0, 0.32),
        inset 3px 3px 0 rgba(255, 255, 255, 0.08);
    }

    .key-up {
      grid-column: 2;
    }

    .key-left {
      grid-column: 1;
      grid-row: 2;
    }

    .key-down {
      grid-column: 2;
      grid-row: 2;
    }

    .key-right {
      grid-column: 3;
      grid-row: 2;
    }

    .space-key {
      grid-column: 1 / 4;
      grid-row: 3;
      width: 100%;
      height: 20px;
      font-size: 10px;
      letter-spacing: 0;
    }

    .mouse {
      width: 50px;
      height: 74px;
      border: 3px solid rgba(248, 232, 194, 0.74);
      border-radius: 22px 22px 19px 19px;
      background: #201e1a;
      box-shadow:
        inset -5px -6px 0 rgba(0, 0, 0, 0.3),
        inset 4px 4px 0 rgba(255, 255, 255, 0.08);
      position: relative;
    }

    .mouse::before,
    .mouse::after {
      content: "";
      position: absolute;
      top: 8px;
      width: 18px;
      height: 28px;
      border: 2px solid rgba(248, 232, 194, 0.45);
      background: rgba(124, 104, 70, 0.18);
    }

    .mouse::before {
      left: 6px;
      border-radius: 13px 2px 4px 4px;
    }

    .mouse::after {
      right: 6px;
      border-radius: 2px 13px 4px 4px;
    }

    .mouse-wheel {
      position: absolute;
      left: 50%;
      top: 11px;
      z-index: 1;
      width: 4px;
      height: 18px;
      background: rgba(248, 232, 194, 0.72);
      transform: translateX(-50%);
    }

    .hint-label {
      max-width: 110px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0;
      line-height: 1.25;
      text-transform: uppercase;
      color: rgba(248, 232, 194, 0.78);
    }

    @media (max-width: 680px) {
      .hint {
        bottom: 12px;
        transform: scale(0.82);
        transform-origin: bottom left;
      }

      .hint-right {
        transform-origin: bottom right;
      }

    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Orthographic dungeon runner game"></canvas>
  <div class="hud">
    <div class="top-hud">
      <form class="level-jump" id="levelJump">
        <label for="levelInput">Go to Level</label>
        <input id="levelInput" type="number" inputmode="numeric" min="0" max="1" step="1" value="0">
        <button type="submit">Go</button>
      </form>
      <div class="inventory">
        <span>Coins <b id="coinCount">0</b></span>
        <span>Health <b id="healthCount">0</b></span>
        <span>Mana <b id="manaCount">0</b></span>
        <span>Magic <b id="magicCount">0</b></span>
        <span>Bombs <b id="bombCount">0</b></span>
      </div>
      <div class="status-line" id="statusLine">World mode</div>
    </div>
    <div class="item-menu hidden" id="itemMenu">
      <span>1 Health</span>
      <span>2 Mana</span>
      <span>3 Magic</span>
      <span>4 Bomb</span>
    </div>
    <div class="hint hint-left">
      <div class="keys">
        <div class="key key-up">&#9650;</div>
        <div class="key key-left">&#9664;</div>
        <div class="key key-down">&#9660;</div>
        <div class="key key-right">&#9654;</div>
        <div class="key space-key">SPACE</div>
      </div>
      <div class="hint-label">Run jump sprint</div>
    </div>
    <div class="hint hint-right">
      <div class="mouse">
        <div class="mouse-wheel"></div>
      </div>
      <div class="hint-label">Move mouse to rotate and tilt</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const levelJump = document.getElementById("levelJump");
    const levelInput = document.getElementById("levelInput");
    const itemMenu = document.getElementById("itemMenu");
    const statusLine = document.getElementById("statusLine");
    const coinCount = document.getElementById("coinCount");
    const healthCount = document.getElementById("healthCount");
    const manaCount = document.getElementById("manaCount");
    const magicCount = document.getElementById("magicCount");
    const bombCount = document.getElementById("bombCount");
    const keys = new Set();
    const availableLevels = [0, 1];
    const inventory = {
      coins: 0,
      health: 0,
      mana: 0,
      magic: 0,
      bombs: 3
    };
    const player = {
      x: 0,
      y: 0,
      heading: 0,
      speed: 255,
      stride: 0,
      z: 0,
      vz: 0,
      jumpAge: 0,
      jumpArm: 0,
      grounded: true,
      stance: "stand",
      rollTime: 0,
      rollX: 0,
      rollY: 0,
      attackTime: 0,
      specialTime: 0,
      interactTime: 0,
      holdingBomb: false,
      bombThrowTime: 0,
      crawlTapTime: 0,
      crawlTaps: 0,
      lastMoveX: 0,
      lastMoveY: -1
    };

    let width = 0;
    let height = 0;
    let dpr = 1;
    let camera = Math.PI / 4;
    let pitch = Math.PI / 4;
    let projectionY = Math.sin(pitch);
    let lastTime = performance.now();
    let fadeAlpha = new URLSearchParams(window.location.search).get("fade") === "1" ? 1 : 0;
    const tile = 64;
    const renderRadius = 14;
    const minPitch = Math.PI / 9;
    const maxPitch = Math.PI * 7 / 18;
    const jumpVelocity = 520;
    const gravity = 1380;

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const hash = (x, y, salt = 0) => {
      let n = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(salt, 1442695041);
      n = (n ^ (n >>> 13)) >>> 0;
      n = Math.imul(n, 1274126177) >>> 0;
      return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
    };

    function resize() {
      dpr = clamp(window.devicePixelRatio || 1, 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = false;
    }

    function rotate(x, y, angle) {
      const c = Math.cos(angle);
      const s = Math.sin(angle);
      return {
        x: x * c - y * s,
        y: x * s + y * c
      };
    }

    function worldToScreen(x, y) {
      const p = rotate(x - player.x, y - player.y, -camera);
      return {
        x: width / 2 + p.x,
        y: height / 2 + p.y * projectionY
      };
    }

    function groundDirection(angle) {
      const screenAngle = angle - camera;
      const x = Math.cos(screenAngle);
      const y = Math.sin(screenAngle) * projectionY;
      const len = Math.hypot(x, y) || 1;
      return {
        x: x / len,
        y: y / len
      };
    }

    function updateProjection() {
      projectionY = Math.sin(pitch);
    }

    function refreshInventory() {
      coinCount.textContent = inventory.coins;
      healthCount.textContent = inventory.health;
      manaCount.textContent = inventory.mana;
      magicCount.textContent = inventory.magic;
      bombCount.textContent = inventory.bombs;
    }

    function setStatus(text) {
      statusLine.textContent = text;
    }

    function toggleItemMenu() {
      itemMenu.classList.toggle("hidden");
      setStatus(itemMenu.classList.contains("hidden") ? "World mode" : "Choose 1-4");
    }

    function chooseItem(slot) {
      itemMenu.classList.add("hidden");
      if (slot === 4) {
        if (inventory.bombs > 0) {
          player.holdingBomb = true;
          setStatus("Bomb ready");
        } else {
          setStatus("No bombs");
        }
        return;
      }

      const types = ["health", "mana", "magic"];
      const type = types[slot - 1];
      if (inventory[type] > 0) {
        inventory[type] -= 1;
        refreshInventory();
        setStatus(`Used ${type}`);
      } else {
        setStatus(`No ${type}`);
      }
    }

    function useWeapon() {
      player.attackTime = 0.28;
      setStatus(player.holdingBomb ? "Sword with bomb" : "Sword strike");
    }

    function specialAction() {
      if (player.holdingBomb) {
        player.holdingBomb = false;
        inventory.bombs = Math.max(0, inventory.bombs - 1);
        player.bombThrowTime = 0.5;
        player.specialTime = 0.3;
        refreshInventory();
        setStatus("Bomb thrown");
      } else {
        player.specialTime = 0.35;
        setStatus("Special action");
      }
    }

    function interact() {
      player.interactTime = 0.3;
      setStatus("Interact");
    }

    function toggleCrouch(moving) {
      if (player.stance === "stand") {
        player.stance = "crouch";
        setStatus("Crouch");
      } else if (player.stance === "crouch" && moving) {
        player.stance = "crawl";
        setStatus("Crawl");
      } else {
        player.stance = "stand";
        setStatus("Stand");
      }
    }

    function drawPolygon(points, fill, stroke, lineWidth = 1) {
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i += 1) {
        ctx.lineTo(points[i].x, points[i].y);
      }
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
      if (stroke) {
        ctx.lineWidth = lineWidth;
        ctx.strokeStyle = stroke;
        ctx.stroke();
      }
    }

    function tileCorners(tx, ty) {
      const x = tx * tile;
      const y = ty * tile;
      return [
        worldToScreen(x, y),
        worldToScreen(x + tile, y),
        worldToScreen(x + tile, y + tile),
        worldToScreen(x, y + tile)
      ];
    }

    function drawFloor() {
      const baseX = Math.floor(player.x / tile);
      const baseY = Math.floor(player.y / tile);

      for (let gy = baseY - renderRadius; gy <= baseY + renderRadius; gy += 1) {
        for (let gx = baseX - renderRadius; gx <= baseX + renderRadius; gx += 1) {
          const dist = Math.hypot((gx + 0.5) * tile - player.x, (gy + 0.5) * tile - player.y);
          if (dist > tile * (renderRadius - 0.8)) continue;

          const shade = Math.floor(35 + hash(gx, gy) * 28);
          const corners = tileCorners(gx, gy);
          drawPolygon(corners, `rgb(${shade}, ${shade - 2}, ${shade - 5})`, "rgba(12, 10, 8, 0.78)", 2);

          const chipCount = 2 + Math.floor(hash(gx, gy, 8) * 3);
          for (let i = 0; i < chipCount; i += 1) {
            const a = hash(gx, gy, 20 + i);
            const b = hash(gx, gy, 40 + i);
            const c = hash(gx, gy, 60 + i);
            const start = {
              x: gx * tile + 10 + a * 42,
              y: gy * tile + 9 + b * 42
            };
            const end = {
              x: start.x + Math.cos(c * Math.PI * 2) * (12 + hash(gx, gy, 80 + i) * 18),
              y: start.y + Math.sin(c * Math.PI * 2) * (12 + hash(gx, gy, 90 + i) * 18)
            };
            const ps = worldToScreen(start.x, start.y);
            const pe = worldToScreen(end.x, end.y);
            ctx.beginPath();
            ctx.moveTo(ps.x, ps.y);
            ctx.lineTo(pe.x, pe.y);
            ctx.strokeStyle = "rgba(8, 7, 6, 0.62)";
            ctx.lineWidth = 2;
            ctx.stroke();
          }

          if (hash(gx, gy, 4) > 0.74) {
            const p = worldToScreen(gx * tile + 16 + hash(gx, gy, 5) * 30, gy * tile + 16 + hash(gx, gy, 6) * 30);
            ctx.fillStyle = "rgba(12, 11, 9, 0.5)";
            ctx.fillRect(Math.floor(p.x), Math.floor(p.y), 5, 4);
          }
        }
      }
    }

    function drawRectCentered(x, y, w, h, fill, stroke) {
      ctx.fillStyle = fill;
      ctx.fillRect(Math.round(x - w / 2), Math.round(y - h / 2), w, h);
      if (stroke) {
        ctx.lineWidth = 2;
        ctx.strokeStyle = stroke;
        ctx.strokeRect(Math.round(x - w / 2), Math.round(y - h / 2), w, h);
      }
    }

    function limb(from, to, width, fill, stroke) {
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len;
      const ny = dx / len;
      drawPolygon([
        { x: from.x + nx * width, y: from.y + ny * width },
        { x: from.x - nx * width, y: from.y - ny * width },
        { x: to.x - nx * width, y: to.y - ny * width },
        { x: to.x + nx * width, y: to.y + ny * width }
      ], fill, stroke, 2);
    }

    function drawCharacter() {
      const baseX = width / 2;
      const baseY = height / 2 + 8;
      const moving = keys.has("ArrowUp") || keys.has("ArrowDown") || keys.has("ArrowLeft") || keys.has("ArrowRight") ||
        keys.has("KeyW") || keys.has("KeyA") || keys.has("KeyS") || keys.has("KeyD");
      const run = moving ? player.stride : -0.2;
      const bob = moving ? Math.abs(Math.sin(run)) * 3 : 0;
      const forward = groundDirection(player.heading);
      const side = { x: -forward.y, y: forward.x };
      const nearSign = side.y >= 0 ? 1 : -1;
      const farSign = -nearSign;
      const lean = moving ? 5 : 1;
      const capeLift = moving ? Math.max(0, Math.sin(run + Math.PI * 0.35)) * 6 : 1;
      const jumpArm = player.jumpArm;
      const airTuck = player.grounded ? 0 : clamp(player.z / 95, 0, 1);
      const bodyScale = player.stance === "crawl" ? 0.52 : player.stance === "crouch" ? 0.74 : 1;
      const stanceDrop = player.stance === "crawl" ? 17 : player.stance === "crouch" ? 9 : 0;
      const attackPose = player.attackTime > 0 ? Math.sin((1 - player.attackTime / 0.28) * Math.PI) : 0;
      const specialPose = player.specialTime > 0 ? Math.sin((1 - player.specialTime / 0.35) * Math.PI) : 0;

      function p(x, z, y) {
        return {
          x: baseX + side.x * x + forward.x * z,
          y: baseY + side.y * x + forward.y * z + y * bodyScale + stanceDrop
        };
      }

      const shadowScale = 1 - clamp(player.z / 230, 0, 0.45);
      ctx.fillStyle = `rgba(0, 0, 0, ${0.42 - clamp(player.z / 420, 0, 0.18)})`;
      ctx.beginPath();
      ctx.ellipse(baseX - forward.x * 6, baseY + 9, 31 * shadowScale, 12 * shadowScale, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(0, -bob - player.z);

      const hip = p(0, -lean, -27);
      const chest = p(0, 5 + lean, -58);
      const shoulderL = p(-18, 4 + lean, -58);
      const shoulderR = p(18, 4 + lean, -58);
      const neck = p(0, 8 + lean, -76);
      const head = p(0, 11 + lean, -86);

      function leg(sign, phase, dark) {
        const swing = Math.sin(phase);
        const lift = moving ? Math.max(0, Math.cos(phase)) * 7 : 0;
        const bend = moving ? Math.max(0.15, Math.cos(phase) * 0.5 + 0.5) : 0.35;
        const hipPoint = p(sign * 8, 0, -29);
        const knee = p(sign * (8 + bend * 5), 8 + swing * 12 - airTuck * 5, -16 - lift * 0.8 - airTuck * 12);
        const foot = p(sign * 12, 16 + swing * 25 - airTuck * 10, -1 - lift - airTuck * 18);
        limb(hipPoint, knee, 6, dark ? "#171512" : "#211d18", "#070605");
        limb(knee, foot, 5, dark ? "#11100e" : "#181511", "#060504");
        drawRectCentered(knee.x, knee.y, 11, 9, dark ? "#24211d" : "#343029", "#070605");
        drawPolygon([
          p(sign * 4, 11 + swing * 25 - airTuck * 10, 0 - lift - airTuck * 18),
          p(sign * 20, 11 + swing * 25 - airTuck * 10, 0 - lift - airTuck * 18),
          p(sign * 19, 27 + swing * 25 - airTuck * 10, 2 - lift - airTuck * 18),
          p(sign * 6, 29 + swing * 25 - airTuck * 10, 2 - lift - airTuck * 18)
        ], "#0d0c0b", "#030302", 2);
      }

      function arm(sign, phase, carriesBlade) {
        const swing = Math.sin(phase);
        const shoulder = p(sign * 18, 5 + lean, -56);
        const bladeSide = carriesBlade ? attackPose : 0;
        const specialSide = carriesBlade ? 0 : specialPose;
        const elbow = p(sign * (21 - jumpArm * 7), 7 - swing * 13 + jumpArm * 15 + bladeSide * 20 + specialSide * 8, -36 - jumpArm * 54);
        const hand = p(sign * (17 - jumpArm * 9), 12 - swing * 24 + jumpArm * 24 + bladeSide * 42 + specialSide * 16, -19 - jumpArm * 92 - specialSide * 12);
        limb(shoulder, elbow, 5, "#211b15", "#070605");
        limb(elbow, hand, 4, "#9d8361", "#21160d");
        drawRectCentered(elbow.x, elbow.y, 8, 8, "#2c2822", "#070605");
        drawRectCentered(hand.x, hand.y, 7, 7, "#a88861", "#21160d");
        if (!carriesBlade && player.holdingBomb) {
          const glow = ctx.createRadialGradient(hand.x, hand.y, 2, hand.x, hand.y, 16);
          glow.addColorStop(0, "rgba(255, 116, 48, 0.45)");
          glow.addColorStop(1, "rgba(0, 0, 0, 0)");
          ctx.fillStyle = glow;
          ctx.fillRect(hand.x - 18, hand.y - 18, 36, 36);
          drawRectCentered(hand.x, hand.y - 3, 12, 12, "#15120f", "#050403");
          ctx.fillStyle = "#f0a13a";
          ctx.fillRect(hand.x + 3, hand.y - 13, 4, 5);
        }
        if (carriesBlade) {
          const tip = p(sign * 18, 42 - swing * 24 + jumpArm * 26 + attackPose * 46, -7 - jumpArm * 82);
          const bladeBase = p(sign * 17, 22 - swing * 24 + jumpArm * 18 + attackPose * 28, -13 - jumpArm * 72);
          drawPolygon([
            { x: hand.x, y: hand.y },
            { x: bladeBase.x + side.x * sign * 3, y: bladeBase.y + side.y * sign * 3 },
            { x: tip.x, y: tip.y },
            { x: bladeBase.x - side.x * sign * 3, y: bladeBase.y - side.y * sign * 3 }
          ], "#cbb276", "#6f5e42", 1);
        }
      }

      const farPhase = farSign < 0 ? run : run + Math.PI;
      const nearPhase = nearSign < 0 ? run : run + Math.PI;
      leg(farSign, farPhase, true);
      drawPolygon([
        p(-19, -6, -56),
        p(19, -6, -56),
        p(23, -38 - capeLift, -10),
        p(4, -44 - capeLift, 0),
        p(-22, -38 - capeLift, -10)
      ], "#2b150b", "#070302", 2);
      drawPolygon([
        p(-10, -8, -51),
        p(10, -8, -51),
        p(12, -30 - capeLift, -14),
        p(-12, -30 - capeLift, -14)
      ], "#4b2614", null);

      if (jumpArm < 0.08) {
        arm(farSign, nearPhase, farSign === 1);
      }
      if (jumpArm < 0.08) {
        drawPolygon([
          p(-16, -16, -43),
          p(16, -16, -43),
          p(23, -38 - capeLift, -10),
          p(4, -44 - capeLift, 0),
          p(-22, -38 - capeLift, -10)
        ], "#35190d", "#070302", 2);
      }
      drawPolygon([
        p(-17, 6 + lean, -59),
        p(17, 6 + lean, -59),
        p(12, 2, -28),
        p(-12, 2, -28)
      ], "#2b241c", "#070605", 2);
      drawPolygon([
        p(-10, 8 + lean, -55),
        p(10, 8 + lean, -55),
        p(8, 5, -31),
        p(-8, 5, -31)
      ], "#5a4936", null);
      drawPolygon([
        p(-5, 10 + lean, -53),
        p(5, 10 + lean, -53),
        p(5, 7, -32),
        p(-5, 7, -32)
      ], "#3a3025", null);
      ctx.strokeStyle = "#1a120c";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(p(-12, 9, -54).x, p(-12, 9, -54).y);
      ctx.lineTo(p(9, 4, -31).x, p(9, 4, -31).y);
      ctx.moveTo(p(12, 9, -54).x, p(12, 9, -54).y);
      ctx.lineTo(p(-9, 4, -31).x, p(-9, 4, -31).y);
      ctx.stroke();
      drawPolygon([
        p(-14, 3, -31),
        p(14, 3, -31),
        p(14, 3, -23),
        p(-14, 3, -23)
      ], "#17130f", "#070605", 2);
      drawRectCentered(p(0, 9, -27).x, p(0, 9, -27).y, 8, 6, "#a58954", "#2a1c0d");

      drawPolygon([
        p(-25, 5, -60),
        p(-11, 6, -61),
        p(-10, 8, -51),
        p(-25, 6, -51)
      ], "#211812", "#050403", 2);
      drawPolygon([
        p(11, 6, -61),
        p(25, 5, -60),
        p(25, 6, -51),
        p(10, 8, -51)
      ], "#2a1f16", "#050403", 2);

      drawPolygon([
        p(-15, 7, -67),
        p(15, 7, -67),
        p(15, 8, -55),
        p(-15, 8, -55)
      ], "#15120f", "#050403", 2);

      const hoodTop = p(0, 8 + lean, -101);
      drawPolygon([
        hoodTop,
        p(18, 8 + lean, -78),
        p(12, 13 + lean, -67),
        p(-12, 13 + lean, -67),
        p(-18, 8 + lean, -78)
      ], "#11100e", "#050403", 2);
      drawRectCentered(head.x, head.y + 7, 14, 14, "#a17b58", "#24170d");
      drawPolygon([
        p(-12, 15 + lean, -90),
        p(12, 15 + lean, -90),
        p(10, 17 + lean, -75),
        p(-10, 17 + lean, -75)
      ], "#1d1b18", "#050403", 2);
      drawRectCentered(p(0, 19 + lean, -82).x, p(0, 19 + lean, -82).y, 10, 4, "#070605", null);

      leg(nearSign, nearPhase, false);
      if (jumpArm >= 0.08) {
        arm(farSign, nearPhase, farSign === 1);
      }
      arm(nearSign, farPhase, nearSign === 1);

      ctx.restore();

      if (player.bombThrowTime > 0) {
        const progress = 1 - player.bombThrowTime / 0.5;
        const distance = 480 * progress;
        const bx = player.x + Math.cos(player.heading) * distance;
        const by = player.y + Math.sin(player.heading) * distance;
        const bomb = worldToScreen(bx, by);
        const arc = Math.sin(progress * Math.PI) * 70;
        drawRectCentered(bomb.x, bomb.y - arc, 13, 13, "#15120f", "#050403");
      }
    }

    function drawLight() {
      const light = ctx.createRadialGradient(width / 2, height / 2, 30, width / 2, height / 2, Math.max(width, height) * 0.48);
      light.addColorStop(0, "rgba(255, 207, 122, 0.12)");
      light.addColorStop(0.2, "rgba(255, 185, 93, 0.06)");
      light.addColorStop(0.42, "rgba(0, 0, 0, 0.18)");
      light.addColorStop(0.72, "rgba(0, 0, 0, 0.84)");
      light.addColorStop(1, "rgba(0, 0, 0, 0.98)");
      ctx.fillStyle = light;
      ctx.fillRect(0, 0, width, height);

      const vignette = ctx.createRadialGradient(width / 2, height / 2, 20, width / 2, height / 2, Math.max(width, height) * 0.72);
      vignette.addColorStop(0, "rgba(0, 0, 0, 0)");
      vignette.addColorStop(0.66, "rgba(0, 0, 0, 0.5)");
      vignette.addColorStop(1, "rgba(0, 0, 0, 1)");
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, width, height);
    }

    function update(delta) {
      let mx = 0;
      let my = 0;
      if (keys.has("ArrowUp") || keys.has("KeyW")) my -= 1;
      if (keys.has("ArrowDown") || keys.has("KeyS")) my += 1;
      if (keys.has("ArrowLeft") || keys.has("KeyA")) mx -= 1;
      if (keys.has("ArrowRight") || keys.has("KeyD")) mx += 1;

      const moving = mx !== 0 || my !== 0;
      const sprinting = keys.has("ShiftLeft") || keys.has("ShiftRight");
      if (moving) {
        const len = Math.hypot(mx, my);
        mx /= len;
        my /= len;
        player.lastMoveX = mx;
        player.lastMoveY = my;
        const world = rotate(mx, my, camera);
        const stanceSpeed = player.stance === "crawl" ? 0.28 : player.stance === "crouch" ? 0.45 : 1;
        const speed = player.speed * (sprinting && player.stance === "stand" ? 1.75 : 1) * stanceSpeed;
        player.x += world.x * speed * delta;
        player.y += world.y * speed * delta;
        player.heading = Math.atan2(world.y, world.x);
        player.stride += delta * (sprinting ? 12 : 15);
      } else {
        player.stride *= Math.pow(0.0008, delta);
      }

      if (player.rollTime > 0) {
        const world = rotate(player.rollX, player.rollY, camera);
        player.x += world.x * player.speed * 2.2 * delta;
        player.y += world.y * player.speed * 2.2 * delta;
        player.heading = Math.atan2(world.y, world.x);
        player.rollTime = Math.max(0, player.rollTime - delta);
      }

      if (!player.grounded) {
        player.jumpAge += delta;
        player.vz -= gravity * delta;
        player.z += player.vz * delta;
        if (player.z <= 0) {
          player.z = 0;
          player.vz = 0;
          player.jumpAge = 0;
          player.grounded = true;
        }
      }

      const targetJumpArm = player.grounded ? 0 : clamp(1 - player.jumpAge / 0.34, 0, 1);
      const armEase = player.grounded ? 18 : 24;
      player.jumpArm += (targetJumpArm - player.jumpArm) * (1 - Math.exp(-armEase * delta));

      player.attackTime = Math.max(0, player.attackTime - delta);
      player.specialTime = Math.max(0, player.specialTime - delta);
      player.interactTime = Math.max(0, player.interactTime - delta);
      player.bombThrowTime = Math.max(0, player.bombThrowTime - delta);
      if (player.crawlTapTime > 0) {
        player.crawlTapTime = Math.max(0, player.crawlTapTime - delta);
        if (player.crawlTapTime === 0) {
          player.crawlTaps = 0;
        }
      }

      if (fadeAlpha > 0) {
        fadeAlpha = Math.max(0, fadeAlpha - delta);
      }
    }

    function render(now) {
      const delta = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      update(delta);

      ctx.clearRect(0, 0, width, height);
      drawFloor();
      drawLight();
      drawCharacter();
      if (fadeAlpha > 0) {
        ctx.fillStyle = `rgba(0, 0, 0, ${fadeAlpha})`;
        ctx.fillRect(0, 0, width, height);
      }
      requestAnimationFrame(render);
    }

    window.addEventListener("resize", resize);
    window.addEventListener("keydown", (event) => {
      if (!itemMenu.classList.contains("hidden") && ["Digit1", "Digit2", "Digit3", "Digit4"].includes(event.code)) {
        event.preventDefault();
        chooseItem(Number(event.code.slice(-1)));
        return;
      }

      if (event.code === "Space") {
        event.preventDefault();
        const moving = keys.has("ArrowUp") || keys.has("ArrowDown") || keys.has("ArrowLeft") || keys.has("ArrowRight") ||
          keys.has("KeyW") || keys.has("KeyA") || keys.has("KeyS") || keys.has("KeyD");
        if (player.stance === "crawl") {
          player.stance = "crouch";
          player.crawlTaps = 0;
          player.crawlTapTime = 0;
          setStatus("Crouch");
          return;
        }
        if (player.stance === "crouch" && moving) {
          player.rollTime = 0.45;
          player.rollX = player.lastMoveX;
          player.rollY = player.lastMoveY;
          player.stance = "stand";
          setStatus("Jump roll");
          return;
        }
        if (!event.repeat && player.grounded) {
          player.grounded = false;
          player.vz = player.stance === "crouch" ? jumpVelocity * 0.82 : jumpVelocity;
          player.jumpAge = 0;
          player.jumpArm = 1;
        }
        return;
      }

      if (event.code === "ControlLeft") {
        event.preventDefault();
        const moving = keys.has("ArrowUp") || keys.has("ArrowDown") || keys.has("ArrowLeft") || keys.has("ArrowRight") ||
          keys.has("KeyW") || keys.has("KeyA") || keys.has("KeyS") || keys.has("KeyD");
        toggleCrouch(moving);
        return;
      }

      if (event.code === "KeyE") {
        event.preventDefault();
        toggleItemMenu();
        return;
      }

      if (event.code === "KeyF") {
        event.preventDefault();
        interact();
        return;
      }

      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "KeyW", "KeyA", "KeyS", "KeyD", "ShiftLeft", "ShiftRight"].includes(event.code)) {
        event.preventDefault();
        keys.add(event.code);
      }
    });
    window.addEventListener("keyup", (event) => keys.delete(event.code));

    canvas.addEventListener("click", () => {
      if (document.pointerLockElement !== canvas) {
        canvas.requestPointerLock();
      }
    });

    canvas.addEventListener("mousedown", (event) => {
      if (event.button === 0) {
        useWeapon();
      }
      if (event.button === 2) {
        specialAction();
      }
    });

    canvas.addEventListener("contextmenu", (event) => event.preventDefault());

    levelJump.addEventListener("submit", (event) => {
      event.preventDefault();
      const level = Number(levelInput.value);
      if (!Number.isInteger(level) || !availableLevels.includes(level)) {
        levelInput.value = "0";
        return;
      }
      window.location.href = `level${level}.html`;
    });

    levelInput.addEventListener("input", () => {
      levelInput.value = levelInput.value.replace(/\D/g, "");
    });

    window.addEventListener("mousemove", (event) => {
      if (document.pointerLockElement === canvas) {
        camera += event.movementX * 0.006;
        pitch = clamp(pitch + event.movementY * 0.0035, minPitch, maxPitch);
        updateProjection();
      } else {
        const center = width / 2;
        const middle = height / 2;
        camera += clamp((event.clientX - center) / center, -1, 1) * 0.0008;
        pitch = clamp(pitch - clamp((middle - event.clientY) / middle, -1, 1) * 0.00035, minPitch, maxPitch);
        updateProjection();
      }
    });

    resize();
    refreshInventory();
    requestAnimationFrame(render);
  </script>
</body>
</html>
